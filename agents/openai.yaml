interface:
  display_name: "Resource 2 NAS"
  short_description: "Search, save, copy, and organize media resources on NAS"
  default_prompt: "Use $resource-2-nas for media search, cloud saves, OpenList copy/tasks, and media organization. Read SKILL.md once as a router, then load only the matching workflow: workflows/search-and-save.md, workflows/openlist-copy.md, or workflows/media-organization.md. For cross-stage tasks, load the next workflow only when needed and carry forward exact selections, parameters, and task IDs. Follow preview/confirmation boundaries; never blindly retry, overwrite, or delete. Automatic archive after this workflow's copy requires terminal SUCCEEDED for every actual file task; externally downloaded or manually copied media can be archived independently by its known path. Use compact output and report only decisions, confirmations, meaningful status changes, errors, and next actions. Never expose credentials."
policy:
  allow_implicit_invocation: true
