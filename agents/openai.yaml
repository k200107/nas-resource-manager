interface:
  display_name: "Resource 2 NAS"
  short_description: "Search media resources, save Quark/Baidu shares, inspect OpenList tasks, and copy saved resources to NAS storage"
  default_prompt: "Use $resource-2-nas for media search, cloud-drive saves, OpenList task progress/cancellation, NAS copy, and media organization. SKILL.md is the single source of truth; read only the relevant workflow once. Search defaults to Aliyun, Quark, Baidu and 10 candidates; use --format json --compact. After the user selects a candidate, reuse its exact provider, share URL, extraction code, and canonical title; do not search again or run link checks unless requested. Never switch a user-selected provider/share. Cloud saves follow preview -> exact user confirmation -> same command with --yes, preserving the previewed URL, destination, selection, resource type, and naming. For OpenList copy, use the exact source parent, item name, and staging destination; preview -> confirmation -> --yes. Trust the copy command's returned terminal SUCCEEDED/FAILED status; legacy numeric state=2 is SUCCEEDED only with progress>=100, endTime, positive totalBytes, and no error (stale uploading text is tolerated only with this evidence); directory-dispatch parent tasks are not file-copy success. If ACTIVE/UNKNOWN, retain and query only that task ID when progress is requested. Do not refresh/list the destination after SUCCEEDED. For media archive requests, do not require a task ID: accept files saved by other tools or manually, using --file, --resource, or one staging scan to locate them. Run check-ready only for first-time setup or a concrete auth/path/configuration error. Never print or persist Cookies/Tokens."
policy:
  allow_implicit_invocation: true
